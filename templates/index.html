<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EcoPuntos - Estación de reciclaje</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1e5a3a 0%, #0e3a22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 48px;
            padding: 2rem 2rem 2.5rem;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1e5a3a;
            margin-top: 0;
            font-size: 2rem;
        }
        .sub {
            color: #2c6e49;
            margin-bottom: 2rem;
            font-weight: 500;
        }
        .codigo-input {
            margin: 1.5rem 0;
        }
        input {
            font-size: 3rem !important;
            text-align: center;
            letter-spacing: 8px;
            width: 100%;
            max-width: 250px;
            padding: 0.5rem;
            border: 3px solid #ccc;
            border-radius: 24px;
            font-family: monospace;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #1e5a3a;
            box-shadow: 0 0 0 3px rgba(30,90,58,0.3);
        }
        button {
            background-color: #1e5a3a;
            color: white;
            border: none;
            font-size: 1.2rem;
            padding: 12px 24px;
            border-radius: 60px;
            margin: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }
        button:active { transform: scale(0.97); }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            transform: none;
        }
        .btn-foto {
            background-color: #0284c7;
            margin-top: 1.2rem;
            font-size: 1.3rem;
            padding: 12px 32px;
        }
        .mensaje {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 40px;
        }
        .valido {
            background-color: #d1fae5;
            color: #065f46;
        }
        .invalido {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #1e5a3a;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #previewContainer {
            margin-top: 1.5rem;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 20px;
            display: none;
        }
        #previewImage {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .info {
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: #4b5563;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #5b6e5f;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>♻️ EcoPuntos</h1>
    <div class="sub">Estación de reciclaje inteligente</div>

    <div class="codigo-input">
        <input type="text" id="codigoInput" maxlength="4" autofocus placeholder="CÓDIGO" autocomplete="off">
    </div>
    <div>
        <button id="btnValidar">🔍 Validar</button>
    </div>

    <div id="mensajeArea" style="min-height: 100px;"></div>

    <div>
        <!-- 🔧 MODO DEBUG: botón siempre habilitado (sin disabled) -->
        <!-- 🔐 MODO NORMAL: para habilitar la validación, cambiar el botón a: disabled -->
        <button id="btnTomarFoto" class="btn-foto">📸 Tomar foto</button>
    </div>

    <div id="previewContainer">
        <img id="previewImage" alt="Vista previa">
        <div class="info" id="previewInfo"></div>
    </div>

    <footer>Ingresa el código de 4 letras que aparece en tu app móvil</footer>
</div>

<script>
    // Elementos DOM
    const inputCodigo = document.getElementById('codigoInput');
    const btnValidar = document.getElementById('btnValidar');
    const btnTomarFoto = document.getElementById('btnTomarFoto');
    const mensajeArea = document.getElementById('mensajeArea');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const previewInfo = document.getElementById('previewInfo');

    let validacionActiva = false;

    // ----- Conversión a mayúsculas y limitación de longitud (siempre útil) -----
    inputCodigo.addEventListener('input', function(e) {
        this.value = this.value.toUpperCase().slice(0,4);
    });

    // ----- Envío con Enter (solo si la validación está habilitada) -----
    inputCodigo.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            // 🔧 MODO DEBUG: comentar la siguiente línea si queremos saltar la validación
            if (!validacionActiva) validarCodigo();
        }
    });

    btnValidar.addEventListener('click', () => {
        // 🔧 MODO DEBUG: comentar esta línea si queremos saltar la validación
        if (!validacionActiva) validarCodigo();
    });

    // ------------------------------------------------------------------
    //  MODO NORMAL (validación con Firebase) - COMENTADO PARA DEBUG
    //  Para volver al flujo normal:
    //   1. Descomentar todo el bloque de la función validarCodigo() de abajo
    //   2. Comentar el bloque "MODO DEBUG (simulación)"
    //   3. En el HTML, agregar 'disabled' al botón btnTomarFoto
    //   4. En el evento del botón Tomar foto, descomentar la verificación de sessionStorage
    // ------------------------------------------------------------------

    /* ----- BLOQUE NORMAL (VALIDACIÓN REAL) - INICIO -----
    async function validarCodigo() {
        let codigo = inputCodigo.value.trim();
        if (codigo.length !== 4) {
            mostrarMensaje("⚠️ Ingresa exactamente 4 caracteres", "invalido");
            return;
        }
        validacionActiva = true;
        mostrarMensaje('<div class="spinner"></div> Validando...', "", true);
        try {
            console.log("Validando:", codigo);
            const response = await fetch('/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo: codigo })
            });
            const data = await response.json();
            if (data.valido) {
                mostrarMensaje(`✅ Código válido - Usuario: ${data.nombre}`, "valido");
                btnTomarFoto.disabled = false;
                sessionStorage.setItem('codigoValidado', codigo);
                previewContainer.style.display = 'none';
            } else {
                mostrarMensaje("❌ Código inválido", "invalido");
                btnTomarFoto.disabled = true;
                sessionStorage.removeItem('codigoValidado');
                setTimeout(() => {
                    inputCodigo.value = '';
                    inputCodigo.focus();
                    if (mensajeArea.innerText.includes("inválido")) mensajeArea.innerHTML = '';
                }, 2000);
            }
        } catch (error) {
            console.error(error);
            mostrarMensaje("⚠️ Error de conexión", "invalido");
            btnTomarFoto.disabled = true;
        } finally {
            validacionActiva = false;
        }
    }
    ----- BLOQUE NORMAL (VALIDACIÓN REAL) - FIN ----- */

    // ----- MODO DEBUG (simula validación exitosa automática) - INICIO -----
    async function validarCodigo() {
        // En modo debug, cualquier código de 4 caracteres se considera válido.
        let codigo = inputCodigo.value.trim();
        if (codigo.length !== 4) {
            mostrarMensaje("⚠️ Ingresa exactamente 4 caracteres", "invalido");
            return;
        }
        validacionActiva = true;
        mostrarMensaje('<div class="spinner"></div> Validando...', "", true);
        // Simulamos una respuesta exitosa después de 1 segundo
        setTimeout(() => {
            mostrarMensaje(`✅ [DEBUG] Código ${codigo} aceptado (simulación)`, "valido");
            btnTomarFoto.disabled = false;
            sessionStorage.setItem('codigoValidado', codigo);
            previewContainer.style.display = 'none';
            validacionActiva = false;
        }, 1000);
    }
    // ----- MODO DEBUG - FIN -----

    function mostrarMensaje(html, clase, esSpinner = false) {
        mensajeArea.innerHTML = `<div class="mensaje ${clase}">${html}</div>`;
    }

    // ----- Captura de foto (siempre activa en modo debug) -----
    btnTomarFoto.addEventListener('click', async () => {
        // 🔧 MODO NORMAL: descomentar las siguientes líneas para requerir validación
        // const codigo = sessionStorage.getItem('codigoValidado');
        // if (!codigo) {
        //     alert("Primero valida un código");
        //     return;
        // }

        btnTomarFoto.disabled = true;
        btnTomarFoto.textContent = '📸 Capturando...';

        try {
            console.log("Solicitando captura...");
            const response = await fetch('/capturar', { method: 'POST' });
            const data = await response.json();
            console.log("Respuesta captura:", data);

            if (data.success) {
                previewImage.src = `data:image/jpeg;base64,${data.image}`;
                previewInfo.textContent = `Resolución: ${data.width} x ${data.height} px`;
                previewContainer.style.display = 'block';
            } else {
                alert(`Error: ${data.error}`);
                previewContainer.style.display = 'none';
            }
        } catch (error) {
            console.error("Error al capturar:", error);
            alert('Error de conexión con el servidor');
            previewContainer.style.display = 'none';
        } finally {
            btnTomarFoto.disabled = false;
            btnTomarFoto.textContent = '📸 Tomar foto';
        }
    });

    console.log("✅ Modo DEBUG activo - La validación es simulada, el botón de foto está siempre habilitado.");
</script>
</body>
</html>
